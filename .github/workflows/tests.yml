name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    steps:
    - uses: actions/checkout@v3

    - name: Install uv and Python ${{ matrix.python }}
      uses: astral-sh/setup-uv@v10.3.1
      with:
        python-version: ${{ matrix.python }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Check with ruff
      run: uv run ruff check indi tests

    - name: Check formatting with ruff
      run: uv run ruff format --check indi tests

    - name: Check with mypy
      run: uv run mypy indi

    - name: Test with pytest
      run: uv run pytest tests
