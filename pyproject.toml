[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "indipy"
dynamic = ["version"]
description = "Python implementation of INDI server and client"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "aiofiles",
]

[project.urls]
Homepage = "https://github.com/wlatanowicz/indipy"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff==0.9.9",
    "types-aiofiles",
]

[tool.setuptools.dynamic]
version = {file = "indi/VERSION"}

[tool.setuptools.packages.find]
include = ["indi*"]
exclude = ["tests*", "docker-examples*"]

[tool.setuptools.package-data]
indi = ["VERSION"]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "I",   # https://docs.astral.sh/ruff/rules/#isort-i
    "E",   # https://docs.astral.sh/ruff/rules/#error-e
    "W",   # https://docs.astral.sh/ruff/rules/#warning-w
    "C4",  # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "F",   # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "G",   # https://docs.astral.sh/ruff/rules/#flake8-logging-format-g
    "B",   # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "UP",  # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "PT",  # https://docs.astral.sh/ruff/rules/#flake8-pytest-style-pt
    "RUF", # https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
    "ERA", # https://docs.astral.sh/ruff/rules/#eradicate-era
    "ISC", # https://docs.astral.sh/ruff/rules/#flake8-implicit-str-concat-isc
    "PIE", # https://docs.astral.sh/ruff/rules/#flake8-pie-pie
    "PGH", # https://docs.astral.sh/ruff/rules/#pygrep-hooks-pgh
    "T20", # https://docs.astral.sh/ruff/rules/#flake8-print-t20
    "PLC", # https://docs.astral.sh/ruff/rules/#convention-plc
    "PLE", # https://docs.astral.sh/ruff/rules/#error-ple
    "PLW", # https://docs.astral.sh/ruff/rules/#warning-plw
    "N",   # https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "RET", # https://docs.astral.sh/ruff/rules/#flake8-return-ret
    "SIM", # https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
    "PTH", # https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
    "PLR", # https://docs.astral.sh/ruff/rules/#refactor-plr
    "C90", # https://docs.astral.sh/ruff/rules/#mccabe-c90
]

ignore = [
    "SIM117",  # https://docs.astral.sh/ruff/rules/multiple-with-statements/
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR0913", # https://docs.astral.sh/ruff/rules/too-many-arguments/
    "PLR2004", # https://docs.astral.sh/ruff/rules/magic-value-comparison/
]
# INDI standard property constructors keep the protocol's PascalCase names.
"indi/device/properties/standard/*.py" = ["N802"]
